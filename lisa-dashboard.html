<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LISA Personal Awareness Dashboard</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #161a21;
      --card: #1d222b;
      --accent: #4fb3ff;
      --accent-2: #7df29e;
      --text: #e6ecf2;
      --muted: #9aa8b5;
      --danger: #ff7b7b;
      --warn: #f2c94c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      padding: 16px;
      background: var(--panel);
      border-bottom: 1px solid #1f2630;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0.5px;
    }
    .pill-row, .control-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid #2a323f;
      background: #1b212c;
      color: var(--text);
      cursor: pointer;
      user-select: none;
      transition: border 0.15s ease, background 0.15s ease;
    }
    .pill input { margin: 0; }
    .pill.active { border-color: var(--accent); background: #1f2c3a; }
    .pill.lane { border-color: #2c3645; }
    .pill.lane.active { border-color: var(--accent-2); background: #1f2f26; }
    .input {
      background: #1b2029;
      border: 1px solid #2a323f;
      color: var(--text);
      padding: 6px 10px;
      border-radius: 8px;
      min-width: 180px;
    }
    .page {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 16px;
      padding: 16px;
      align-items: flex-start;
    }
    @media (max-width: 1100px) {
      .page { grid-template-columns: 1fr; }
    }
    .panel {
      background: var(--panel);
      border: 1px solid #1f2630;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }
    .section-title {
      margin: 0 0 8px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
    }
    .feed-list, .rec-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 75vh;
      overflow-y: auto;
      padding-right: 4px;
    }
    .card {
      background: var(--card);
      border: 1px solid #212836;
      border-radius: 10px;
      padding: 10px 12px;
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr;
      gap: 8px;
      align-items: center;
    }
    .card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
    }
    .lane {
      padding: 3px 7px;
      border-radius: 6px;
      font-size: 11px;
      letter-spacing: 0.5px;
      background: #243144;
      color: var(--accent);
    }
    .meta { color: var(--muted); font-size: 12px; }
    .delta { font-weight: 600; }
    .delta.pos { color: var(--accent-2); }
    .delta.neg { color: var(--danger); }
    .delta.flat { color: var(--muted); }
    .row-actions { display: flex; gap: 8px; justify-content: flex-end; }
    button {
      border: 1px solid #2a323f;
      background: #1c2430;
      color: var(--text);
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: border 0.15s ease, transform 0.1s ease;
    }
    button:hover { border-color: var(--accent); }
    button:active { transform: translateY(1px); }
    .tag { font-size: 11px; padding: 2px 6px; border-radius: 6px; background: #232c39; color: var(--muted); }
    .empty { color: var(--muted); font-size: 13px; padding: 6px 0; }
    .health-card {
      background: var(--card);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      border: 1px solid #212836;
    }
    .health-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }
    .health-status {
      font-weight: 600;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }
    .health-status.green { color: #7df29e; background: rgba(125,242,158,0.08); }
    .health-status.yellow { color: #f2c94c; background: rgba(242,201,76,0.08); }
    .health-status.red { color: #ff7b7b; background: rgba(255,123,123,0.08); }
    .health-metrics { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 4px 10px; font-size: 12px; }
    .health-metric-label { color: var(--muted); }
    .health-metric-value { font-weight: 600; }
    
    /* Chatbox */
    .chatbox {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 380px;
      max-height: 500px;
      background: var(--panel);
      border: 1px solid #1f2630;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      z-index: 100;
    }
    .chatbox-header {
      padding: 12px 16px;
      background: var(--card);
      border-bottom: 1px solid #1f2630;
      border-radius: 12px 12px 0 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      font-size: 14px;
    }
    .chatbox-toggle {
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      background: #1c2430;
      border: 1px solid #2a323f;
    }
    .chatbox-toggle:hover { border-color: var(--accent); }
    .chatbox-messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 350px;
    }
    .chatbox-message {
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.4;
    }
    .chatbox-message.user {
      background: #1f2c3a;
      border: 1px solid var(--accent);
      align-self: flex-end;
      max-width: 85%;
    }
    .chatbox-message.assistant {
      background: var(--card);
      border: 1px solid #2a323f;
      align-self: flex-start;
      max-width: 85%;
    }
    .chatbox-input-area {
      padding: 12px;
      border-top: 1px solid #1f2630;
      display: flex;
      gap: 8px;
    }
    .chatbox-input {
      flex: 1;
      background: #1b2029;
      border: 1px solid #2a323f;
      color: var(--text);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
    }
    .chatbox-input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .chatbox-send {
      background: var(--accent);
      color: #0f1115;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }
    .chatbox-send:hover { opacity: 0.85; }
    .chatbox-send:disabled { opacity: 0.5; cursor: not-allowed; }
    .chatbox.minimized .chatbox-messages,
    .chatbox.minimized .chatbox-input-area {
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>LISA Personal Awareness Dashboard (Read-Only)</h1>
    <div class="pill-row" id="laneToggles"></div>
    <input id="assetFilter" class="input" type="text" placeholder="Asset filter (oil, gold, corn, nfl)" />
  </header>

  <div class="panel" style="margin: 12px 16px;">
    <div class="section-title">Tags (client-side, in-memory)</div>
    <div class="pill-row" id="tagToggles"></div>
    <div class="control-row" style="margin-top:8px;">
      <button id="clearFiltersBtn">Clear filters (tags + asset)</button>
      <div class="meta">Toggles affect rendering only. No persistence. Refresh resets.</div>
    </div>
  </div>

  <div class="page">
    <section class="panel">
      <div class="section-title">Signals Passing Panel Filters</div>
      <div id="filterStatus"></div>
      <div id="streamHealth" style="display: flex; gap: 12px; padding: 8px 0; font-size: 12px; border-bottom: 1px solid #1f2630; margin-bottom: 8px;"></div>
      <div class="feed-list" id="feed"></div>
    </section>

    <section class="panel">
      <div class="section-title">Bridge Health (ops lane)</div>
      <div id="bridgeHealth"></div>
    </section>

    <section class="panel">
      <div class="section-title">Untracked Movers (Recommendations)</div>
      <div class="rec-list" id="recs"></div>
    </section>
  </div>

  <div class="chatbox" id="chatbox">
    <div class="chatbox-header">
      <span>Ask LISA</span>
      <span class="chatbox-toggle" id="chatboxToggle">−</span>
    </div>
    <div class="chatbox-messages" id="chatMessages"></div>
    <div class="chatbox-input-area">
      <input 
        type="text" 
        class="chatbox-input" 
        id="chatInput" 
        placeholder="Ask about signals, lanes, or data..."
      />
      <button class="chatbox-send" id="chatSend">Send</button>
    </div>
  </div>

  <script>
    // Configuration
    const STREAM_URL = "http://localhost:3000/stream"; // v1 SSE
    const DEFAULT_TAGS = [
      "prices:energy",
      "prices:metals",
      "sports:odds",
      "info:macro"
    ];
    const DEFAULT_LANES = ["prices", "capacity", "info", "sports", "macro", "ops"];

    const BRIDGE_HEALTH_RULES = {
      GREEN: { maxRetries: 0, allowBackpressure: false },
      YELLOW: { maxFailures: 0 },
      RED: { minFailures: 1 },
    };

    const state = {
      feed: [],
      recs: [],
      bridgeHealth: null,
      // Panel filters (control "Accepted Signals" rendering)
      panelFilter: {
        activeTags: new Set(DEFAULT_TAGS),
        activeLanes: new Set(DEFAULT_LANES),
        assetFilter: "",
      },
      // Stream health
      streamConnected: false,
      lastSignalAt: null,
      receivedCount: 0,
      acceptedCount: 0,
      watchMatchedCount: 0,
      lastMatchAt: null,
    };

    const feedEl = document.getElementById("feed");
    const recsEl = document.getElementById("recs");
    const bridgeHealthEl = document.getElementById("bridgeHealth");
    const laneTogglesEl = document.getElementById("laneToggles");
    const tagTogglesEl = document.getElementById("tagToggles");
    const clearFiltersBtn = document.getElementById("clearFiltersBtn");
    const assetFilterEl = document.getElementById("assetFilter");
    const chatboxEl = document.getElementById("chatbox");
    const chatMessagesEl = document.getElementById("chatMessages");
    const chatInputEl = document.getElementById("chatInput");
    const chatSendEl = document.getElementById("chatSend");
    const chatboxToggleEl = document.getElementById("chatboxToggle");

    const chatHistory = [];
    let watchFilter = { kind: "off" };
    const liveGate = { lastAtMs: 0, recentKeys: new Map() };

    // Stream filtering utilities
    function norm(s) {
      return String(s ?? "")
        .toLowerCase()
        .trim()
        .replace(/\s+/g, " ");
    }

    function matchMode(haystack, needle, mode) {
      if (!needle) return false;
      if (mode === "exact") return haystack === needle;
      if (mode === "startsWith") return haystack.startsWith(needle);
      return haystack.includes(needle); // contains
    }

    function checkStreamMatch(signal, filter) {
      if (!filter || filter.kind === "off") return false;

      const needle = norm(filter.value);
      const lane = norm(signal.lane);
      const entity = norm(signal.entity);
      const asset = norm(signal.asset);
      const symbol = norm(signal.symbol);

      switch (filter.kind) {
        case "lane":
          return matchMode(lane, needle, filter.mode);
        case "entity":
          return (
            matchMode(entity, needle, filter.mode) ||
            matchMode(asset, needle, filter.mode) ||
            matchMode(symbol, needle, filter.mode)
          );
        case "any":
          return (
            matchMode(lane, needle, filter.mode) ||
            matchMode(entity, needle, filter.mode) ||
            matchMode(asset, needle, filter.mode) ||
            matchMode(symbol, needle, filter.mode)
          );
        default:
          return false;
      }
    }

    function shouldEmitLiveChat(gate, signal, opts = {}) {
      const minIntervalMs = opts.minIntervalMs ?? 400;       // max 2.5 msgs/sec
      const dedupeWindowMs = opts.dedupeWindowMs ?? 10000;   // 10s dedupe

      const now = Date.now();

      // rate limit
      if (now - gate.lastAtMs < minIntervalMs) return false;

      // dedupe key
      const key = `${signal.lane ?? ""}|${signal.entity ?? ""}|${signal.asset ?? ""}|${signal.symbol ?? ""}|${signal.delta ?? ""}`;

      // purge old keys
      for (const [k, t] of gate.recentKeys) {
        if (now - t > dedupeWindowMs) gate.recentKeys.delete(k);
      }

      if (gate.recentKeys.has(key)) return false;

      gate.recentKeys.set(key, now);
      gate.lastAtMs = now;
      return true;
    }

    function parseChatCommand(text) {
      const t = text.trim();
      const lower = t.toLowerCase();

      if (lower === "unwatch" || lower === "watch off" || lower === "stop") return { cmd: "unwatch", args: "" };
      if (lower === "watch" || lower === "watch status" || lower === "status") return { cmd: "watchstatus", args: "" };
      if (lower.startsWith("watch ")) return { cmd: "watch", args: t.slice(6).trim() };
      if (lower.startsWith("follow ")) return { cmd: "follow", args: t.slice(7).trim() }; // alias for watch
      if (lower.startsWith("inject ")) return { cmd: "inject", args: t.slice(7).trim() };

      return { cmd: null, args: "" };
    }

    function buildFilterFromWatchArgs(args) {
      const a = args.trim();
      const lower = a.toLowerCase();

      let mode = "contains";
      let rest = a;

      if (lower.startsWith("exact:")) { mode = "exact"; rest = a.slice(6).trim(); }
      else if (lower.startsWith("starts:")) { mode = "startsWith"; rest = a.slice(7).trim(); }

      const lrest = rest.toLowerCase();
      if (lrest.startsWith("lane:")) return { kind: "lane", value: rest.slice(5).trim(), mode };
      if (lrest.startsWith("any:")) return { kind: "any", value: rest.slice(4).trim(), mode };
      if (lrest.startsWith("entity:")) return { kind: "entity", value: rest.slice(7).trim(), mode };

      return { kind: "entity", value: rest, mode };
    }

    function passesPanelFilter(sig, pf) {
      // Lane filter
      if (sig.lane && !pf.activeLanes.has(sig.lane.toLowerCase())) return false;
      
      // Tag filter
      const tags = Array.isArray(sig.tags) ? sig.tags : sig.tag ? [sig.tag] : [];
      if (pf.activeTags.size > 0 && !tags.some(t => pf.activeTags.has(t))) return false;
      
      // Asset filter
      if (pf.assetFilter) {
        const needle = norm(pf.assetFilter);
        const match = matchMode(norm(sig.entity), needle, "contains") ||
                      matchMode(norm(sig.asset), needle, "contains") ||
                      matchMode(norm(sig.symbol), needle, "contains");
        if (!match) return false;
      }
      
      return true;
    }

    function matchesWatchFilter(sig, wf) {
      return checkStreamMatch(sig, wf);
    }

    function renderLaneToggles() {
      laneTogglesEl.innerHTML = "";
      DEFAULT_LANES.forEach(lane => {
        const pill = document.createElement("label");
        pill.className = `pill lane ${state.panelFilter.activeLanes.has(lane) ? "active" : ""}`;
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = state.panelFilter.activeLanes.has(lane);
        cb.onchange = () => {
          if (cb.checked) state.panelFilter.activeLanes.add(lane); else state.panelFilter.activeLanes.delete(lane);
          renderFeed();
          renderFilterStatus();
        };
        const span = document.createElement("span");
        span.textContent = lane.toUpperCase();
        pill.append(cb, span);
        laneTogglesEl.appendChild(pill);
      });
    }

    function renderTagToggles() {
      tagTogglesEl.innerHTML = "";
      DEFAULT_TAGS.forEach(tag => {
        const pill = document.createElement("label");
        pill.className = `pill ${state.panelFilter.activeTags.has(tag) ? "active" : ""}`;
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = state.panelFilter.activeTags.has(tag);
        cb.onchange = () => {
          if (cb.checked) state.panelFilter.activeTags.add(tag); else state.panelFilter.activeTags.delete(tag);
          renderAll();
          renderFilterStatus();
        };
        const span = document.createElement("span");
        span.textContent = tag;
        pill.append(cb, span);
        tagTogglesEl.appendChild(pill);
      });
    }

    function fmtDirection(dir) {
      if (dir === "up" || dir === "+") return "↑";
      if (dir === "down" || dir === "-") return "↓";
      return "→";
    }

    function computeBridgeHealthStatus(metrics) {
      if (!metrics) return "unknown";
      const retries = Number(metrics.retries || 0);
      const failures = Number(metrics.failures || 0);
      const queue = Number(metrics.queue || 0);
      const backpressureEvents = Number(metrics.backpressureCount || 0);

      if (failures >= BRIDGE_HEALTH_RULES.RED.minFailures || backpressureEvents > 0) {
        return "red";
      }
      if (retries > BRIDGE_HEALTH_RULES.YELLOW.maxFailures || queue > 0) {
        return "yellow";
      }
      if (
        retries <= BRIDGE_HEALTH_RULES.GREEN.maxRetries &&
        backpressureEvents === 0
      ) {
        return "green";
      }
      return "yellow";
    }

    function renderBridgeHealth() {
      bridgeHealthEl.innerHTML = "";
      const sig = state.bridgeHealth;
      if (!sig || !sig.metrics) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No bridge health samples yet.";
        bridgeHealthEl.appendChild(empty);
        return;
      }

      const metrics = sig.metrics;
      const status = computeBridgeHealthStatus(metrics);

      const card = document.createElement("div");
      card.className = "health-card";

      const header = document.createElement("div");
      header.className = "health-header";
      const title = document.createElement("div");
      title.textContent = "Bridge → v1";
      const statusEl = document.createElement("span");
      statusEl.className = `health-status ${status}`;
      statusEl.textContent = status.toUpperCase();
      header.append(title, statusEl);

      const grid = document.createElement("div");
      grid.className = "health-metrics";

      function addMetric(label, value) {
        const wrap = document.createElement("div");
        const l = document.createElement("div");
        l.className = "health-metric-label";
        l.textContent = label;
        const v = document.createElement("div");
        v.className = "health-metric-value";
        v.textContent = String(value ?? 0);
        wrap.append(l, v);
        grid.appendChild(wrap);
      }

      addMetric("forwarded", metrics.forwarded);
      addMetric("dropped", metrics.dropped);
      addMetric("duplicates", metrics.duplicates);
      addMetric("oversize", metrics.oversize);
      addMetric("retries", metrics.retries);
      addMetric("failures", metrics.failures);
      addMetric("backpressureCount", metrics.backpressureCount);
      addMetric("queue", metrics.queue);
      addMetric("inFlight", metrics.inFlight);

      card.append(header, grid);
      bridgeHealthEl.appendChild(card);
    }

    function renderFeed() {
      feedEl.innerHTML = "";
      const accepted = state.feed.filter(sig => passesPanelFilter(sig, state.panelFilter));
      state.acceptedCount = accepted.length;
      
      if (accepted.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        let emptyText = `No signals passing panel filters (${state.receivedCount} received).`;
        
        // Hint if received but none accepted
        if (state.receivedCount > 0 && state.acceptedCount === 0) {
          const hint = document.createElement("div");
          hint.style.color = "var(--warn)";
          hint.style.fontSize = "11px";
          hint.style.marginTop = "4px";
          hint.textContent = "💡 No signals match panel filters. Try enabling lanes or clearing tags/asset filter.";
          empty.textContent = emptyText;
          empty.appendChild(hint);
        } else {
          empty.textContent = emptyText;
        }
        
        feedEl.appendChild(empty);
        return;
      }
      accepted.slice(0, 400).forEach(sig => {
        const card = document.createElement("div");
        card.className = "card";

        const dir = fmtDirection(sig.direction);
        const delta = sig.delta ?? sig.magnitude ?? sig.value;
        const deltaClass = delta > 0 ? "pos" : delta < 0 ? "neg" : "flat";

        const header = document.createElement("div");
        header.className = "card-header";
        const lane = document.createElement("span");
        lane.className = "lane";
        lane.textContent = (sig.lane || "").toString().toUpperCase();
        const ent = document.createElement("span");
        const testPrefix = sig.isTest ? "🧪 TEST: " : "";
        ent.textContent = testPrefix + (sig.entity || sig.asset || sig.symbol || "(entity)");
        header.append(lane, ent);

        const mid = document.createElement("div");
        mid.innerHTML = `<span class="delta ${deltaClass}">${dir} ${delta ?? ""}</span>`;

        const meta = document.createElement("div");
        meta.className = "meta";
        const ts = sig.timestamp || sig.time || sig.arrivalTime;
        meta.textContent = `${ts ? new Date(ts).toLocaleTimeString() : ""} · ${sig.source || sig.origin || ""}`;

        card.append(header, mid, meta);
        feedEl.appendChild(card);
      });
    }

    function renderRecs() {
      recsEl.innerHTML = "";
      if (state.recs.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No untracked movers right now.";
        recsEl.appendChild(empty);
        return;
      }
      state.recs.slice(-200).reverse().forEach(rec => {
        const card = document.createElement("div");
        card.className = "card";

        const header = document.createElement("div");
        header.className = "card-header";
        const lane = document.createElement("span");
        lane.className = "lane";
        lane.textContent = (rec.lane || "").toString().toUpperCase();
        const ent = document.createElement("span");
        ent.textContent = rec.entity || rec.asset || rec.symbol || "(entity)";
        header.append(lane, ent);

        const mid = document.createElement("div");
        mid.innerHTML = `<span class="delta pos">Δ ${rec.delta ?? "?"}</span> · ${rec.window || "window"} · ${rec.reason || "sharp_delta"}`;

        const actions = document.createElement("div");
        actions.className = "row-actions";
        const tags = Array.isArray(rec.suggested_tags) ? rec.suggested_tags : [];

        const tagsRow = document.createElement("div");
        tagsRow.className = "pill-row";
        tags.forEach(t => {
          const tagEl = document.createElement("span");
          tagEl.className = "tag";
          tagEl.textContent = t;
          tagsRow.appendChild(tagEl);
        });

        const addBtn = document.createElement("button");
        addBtn.textContent = "Add Tag";
        addBtn.onclick = () => {
          tags.forEach(t => state.activeTags.add(t));
          renderTagToggles();
          renderAll();
        };

        const ignoreBtn = document.createElement("button");
        ignoreBtn.textContent = "Ignore (session)";
        ignoreBtn.onclick = () => {
          state.recs = state.recs.filter(r => r !== rec);
          renderRecs();
        };

        actions.append(addBtn, ignoreBtn);

        const meta = document.createElement("div");
        meta.className = "meta";
        const ts = rec.timestamp || rec.time || rec.arrivalTime;
        meta.textContent = `${ts ? new Date(ts).toLocaleTimeString() : ""} · ${rec.source || "delta-scanner"}`;

        card.append(header, tagsRow, mid, meta, actions);
        recsEl.appendChild(card);
      });
    }

    function renderAll() {
      renderFeed();
      renderRecs();
      renderBridgeHealth();
    }

    function clearFilters() {
      state.panelFilter.activeTags.clear();
      state.panelFilter.assetFilter = "";
      assetFilterEl.value = "";
      renderTagToggles();
      renderAll();      renderFilterStatus();    }

    function handleSignal(sig) {
      // Update stream health
      state.lastSignalAt = Date.now();
      state.receivedCount++;
      
      if (sig.type === "tag_recommendation") {
        state.recs.push(sig);
        state.recs = state.recs.slice(-200); // cap recs
        renderRecs();
        return;
      }

      if (sig.kind === "bridge_health" || sig.signal === "bridge.health") {
        state.bridgeHealth = sig;
        renderBridgeHealth();
      }
      
      // Always add to feed (bounded)
      state.feed = [sig, ...state.feed].slice(0, 500);
      renderFeed();
      
      // LIVE chat: watch filter matched AND passes panel filter (keeps coherence)
      const watchMatched = matchesWatchFilter(sig, watchFilter);
      const panelPassed = passesPanelFilter(sig, state.panelFilter);
      
      if (watchMatched && panelPassed && shouldEmitLiveChat(liveGate, sig)) {
        state.watchMatchedCount++;
        state.lastMatchAt = Date.now();
        const summary = formatSignalForChat(sig);
        addChatMessage("assistant", `🔴 LIVE: ${summary}`);
      }
    }
    
    function formatSignalForChat(sig) {
      const entity = sig.entity || sig.asset || sig.symbol || "unknown";
      const lane = sig.lane || "?";
      const delta = sig.delta ?? sig.magnitude ?? sig.value ?? "?";
      const dir = fmtDirection(sig.direction);
      const time = sig.timestamp ? new Date(sig.timestamp).toLocaleTimeString() : "now";
      const testPrefix = sig.isTest ? "🧪 TEST: " : "";
      return `${testPrefix}${lane.toUpperCase()} | ${entity} ${dir} ${delta} at ${time}`;
    }

    function startStream() {
      const es = new EventSource(STREAM_URL);
      const handleDataPayload = (raw) => {
        console.log("STREAM EVENT:", raw);
        try {
          const data = JSON.parse(raw);
          if (Array.isArray(data)) {
            data.forEach(handleSignal);
          } else {
            handleSignal(data);
          }
        } catch (err) {
          console.error("Failed to parse event", err, raw);
        }
      };

      // v1 stream uses named SSE events (hello/state_update/state_expired)
      es.addEventListener("hello", evt => {
        console.log("SSE HELLO:", evt.data);
        state.streamConnected = true;
        renderStreamHealth();
      });

      es.addEventListener("state_update", evt => {
        handleDataPayload(evt.data);
      });

      es.addEventListener("state_expired", evt => {
        console.log("SSE STATE_EXPIRED:", evt.data);
      });

      es.addEventListener("open", () => {
        state.streamConnected = true;
        renderStreamHealth();
      });

      // Fallback for any unnamed/default events
      es.onmessage = evt => {
        handleDataPayload(evt.data);
      };
      es.onerror = err => {
        console.error("SSE error", err);
        state.streamConnected = false;
        renderStreamHealth();
      };
    }

    function renderStreamHealth() {
      const healthEl = document.getElementById("streamHealth");
      if (!healthEl) return;
      
      const status = state.streamConnected ? "Connected" : "Disconnected";
      const statusClass = state.streamConnected ? "health-status green" : "health-status red";
      const lastSignal = state.lastSignalAt ? new Date(state.lastSignalAt).toLocaleTimeString() : "never";
      
      healthEl.innerHTML = `
        <span class="${statusClass}">${status}</span>
        <span class="meta">Last: ${lastSignal}</span>
        <span class="meta">Received: ${state.receivedCount} | Accepted: ${state.acceptedCount} | Watch matched: ${state.watchMatchedCount}</span>
      `;
    }
    
    function renderFilterStatus() {
      const statusEl = document.getElementById("filterStatus");
      if (!statusEl) return;
      
      // Panel filter status
      const panelLanes = Array.from(state.panelFilter.activeLanes).join("+") || "all";
      const panelTags = Array.from(state.panelFilter.activeTags).slice(0, 2).join(", ") || "all";
      const panelTagsSuffix = state.panelFilter.activeTags.size > 2 ? ` +${state.panelFilter.activeTags.size - 2}` : "";
      const panelAsset = state.panelFilter.assetFilter || "all";
      
      // Watch filter status
      const isWatching = watchFilter.kind && watchFilter.kind !== "off";
      let watchStatus = "⏸️ off";
      let watchDetails = "";
      
      if (isWatching) {
        const mode = watchFilter.mode || "contains";
        const scopeDesc = watchFilter.kind === "entity" ? "entity/asset/symbol" : watchFilter.kind;
        watchStatus = `🔴 ${scopeDesc} ${mode} "${watchFilter.value}"`;
        
        // Last match timing
        const matchAge = state.lastMatchAt ? Math.floor((Date.now() - state.lastMatchAt) / 1000) : null;
        const matchTiming = matchAge !== null ? `${matchAge}s ago` : "—";
        watchDetails = `<div style="margin-top: 3px; font-size: 10px; color: var(--muted);">Last match: ${matchTiming} | Matches: ${state.watchMatchedCount}</div>`;
        
        // Actionable diagnosis (why you might not see hits)
        let diagnosis = "";
        if (state.receivedCount === 0) {
          diagnosis = `<div style="margin-top: 4px; padding: 4px 6px; background: rgba(255,123,123,0.08); border-left: 2px solid #ff7b7b; font-size: 10px;">⚠️ No stream signals yet. <a href="#" onclick="location.reload(); return false;" style="color: var(--accent); text-decoration: underline;">Reconnect</a></div>`;
        } else if (state.receivedCount > 0 && state.acceptedCount === 0) {
          diagnosis = `<div style="margin-top: 4px; padding: 4px 6px; background: rgba(242,201,76,0.08); border-left: 2px solid #f2c94c; font-size: 10px;">⚠️ Panel filters blocking all signals. <a href="#" onclick="document.getElementById('clearFiltersBtn').click(); return false;" style="color: var(--accent); text-decoration: underline;">Clear filters</a></div>`;
        } else if (state.acceptedCount > 0 && state.watchMatchedCount === 0) {
          const broaderCmd = watchFilter.kind === "entity" ? `any:${watchFilter.value}` : watchFilter.value;
          diagnosis = `<div style="margin-top: 4px; padding: 4px 6px; background: rgba(242,201,76,0.08); border-left: 2px solid #f2c94c; font-size: 10px;">💡 No matches for "${watchFilter.value}" in accepted signals. Try <span style="color: var(--accent); cursor: pointer;" onclick="document.getElementById('chatInput').value='watch ${broaderCmd}'; document.getElementById('chatSend').click();">watch ${broaderCmd}</span> or <span style="color: var(--accent); cursor: pointer;" onclick="document.getElementById('chatInput').value='status'; document.getElementById('chatSend').click();">status</span></div>`;
        }
        
        watchDetails += diagnosis;
      }
      
      statusEl.innerHTML = `
        <div style="font-size: 11px; color: var(--muted); padding: 6px 0; border-bottom: 1px solid #1f2630;">
          <div style="margin-bottom: 2px;"><strong>Panel:</strong> ${panelLanes} | tags: ${panelTags}${panelTagsSuffix} | asset: ${panelAsset}</div>
          <div><strong>Watch:</strong> ${watchStatus}</div>
          ${watchDetails}
        </div>
      `;
    }

    function init() {
      renderLaneToggles();
      renderTagToggles();
      renderAll();
      renderStreamHealth();
      renderFilterStatus();
      assetFilterEl.addEventListener("input", e => {
        state.panelFilter.assetFilter = e.target.value.trim();
        renderFeed();
        renderFilterStatus();
      });
      clearFiltersBtn.addEventListener("click", clearFilters);
      startStream();
      setInterval(renderStreamHealth, 1000); // update every second
      
      // Runtime self-check (dev mode only): log diagnostics every 10s
      // STRICT DEV GATE: normalized hostname check with explicit allow/deny
      const host = String(location.hostname || "").toLowerCase();
      
      const IS_LOCALHOST = host === "localhost" || host === "127.0.0.1";
      
      // Add every production domain you might ever serve from:
      const IS_PROD_DOMAIN =
        host === "thetradescout.com" ||
        host.endsWith(".thetradescout.com") ||
        host === "tradescout.com" ||
        host.endsWith(".tradescout.com");
      
      const IS_DEV = IS_LOCALHOST && !IS_PROD_DOMAIN;
      
      if (IS_DEV) {
        setInterval(() => {
          const age = state.lastSignalAt ? Math.floor((Date.now() - new Date(state.lastSignalAt).getTime()) / 1000) : null;
          console.log(
            `[WATCH SELF-CHECK] connected=${state.streamConnected} | ` +
            `received=${state.receivedCount} | accepted=${state.acceptedCount} | ` +
            `watchMatched=${state.watchMatchedCount} | lastSignal=${age ? age + 's ago' : 'never'}`
          );
        }, 10_000);
      }
    }

    // Chatbox functions
    function toggleChatbox() {
      chatboxEl.classList.toggle("minimized");
      chatboxToggleEl.textContent = chatboxEl.classList.contains("minimized") ? "+" : "−";
    }

    function addChatMessage(role, content) {
      chatHistory.push({ role, content, ts: Date.now() });
      const msgEl = document.createElement("div");
      msgEl.className = `chatbox-message ${role}`;
      msgEl.textContent = content; // safe: plain text only
      chatMessagesEl.appendChild(msgEl);
      
      // Cap chat history DOM and memory
      while (chatMessagesEl.children.length > 200) {
        chatMessagesEl.removeChild(chatMessagesEl.firstChild);
      }
      if (chatHistory.length > 200) {
        chatHistory.splice(0, chatHistory.length - 200);
      }
      
      chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
    }

    function answerQuestion(question) {
      const parsed = parseChatCommand(question);
      
      // Handle watch commands
      if (parsed.cmd === "watch" || parsed.cmd === "follow") {
        if (!parsed.args) return "Usage: watch oil | watch lane:prices | watch any:btc | watch exact:cl\nNote: Watch filter respects panel filters (lanes/tags/asset).";
        watchFilter = buildFilterFromWatchArgs(parsed.args);
        state.watchMatchedCount = 0; // reset counter
        state.lastMatchAt = null; // reset last match time
        renderFilterStatus();
        const aliasNote = parsed.cmd === "follow" ? "\n(Using watch — follow is an alias)" : "";
        return `🔴 Watching: ${watchFilter.kind} "${watchFilter.value}" (${watchFilter.mode}).\nLIVE updates respect panel filters.${aliasNote}`;
      }
      
      if (parsed.cmd === "unwatch") {
        watchFilter = { kind: "off" };
        renderFilterStatus();
        return `⏸️ Stopped watching. Stream continues in background.`;
      }
      
      if (parsed.cmd === "watchstatus") {
        const connStatus = state.streamConnected ? "✅ Connected" : "❌ Disconnected";
        const age = state.lastSignalAt ? Math.floor((Date.now() - new Date(state.lastSignalAt).getTime()) / 1000) : null;
        const lastSig = age !== null ? `${age}s ago` : "never";
        
        const panelLanes = state.panelFilter.activeLanes.size > 0 ? Array.from(state.panelFilter.activeLanes).join(", ") : "all";
        const panelTags = state.panelFilter.activeTags.size > 0 ? Array.from(state.panelFilter.activeTags).join(", ") : "all";
        const panelAsset = state.panelFilter.assetFilter ? `asset: ${state.panelFilter.assetFilter}` : "asset: all";
        
        const watchStatus = watchFilter.kind !== "off" 
          ? `🔴 ${watchFilter.kind} "${watchFilter.value}" (${watchFilter.mode})`
          : "⏸️ off";
        
        return (
          `Stream: ${connStatus} | Last signal: ${lastSig}\n` +
          `Panel: lanes [${panelLanes}] | tags [${panelTags}] | ${panelAsset}\n` +
          `Watch: ${watchStatus}\n` +
          `Counters: received=${state.receivedCount} | accepted=${state.acceptedCount} | watchMatched=${state.watchMatchedCount}`
        );
      }
      
      // Inject test signal (dev-only)
      if (parsed.cmd === "inject") {
        if (!IS_DEV) return "⛔ inject command is dev-only (not available in production).";
        if (!parsed.args) return "Usage: inject oil | inject lane:prices entity:crude_oil delta:+5";
        
        // Parse inject args into signal-like structure
        const parts = parsed.args.split(/\s+/);
        const testSignal = {
          id: `test-${Date.now()}`,
          timestamp: new Date().toISOString(),
          entity: "",
          lane: "PRICES",
          asset: "",
          symbol: "",
          delta: null,
          direction: "→",
          tags: [],
          isTest: true // mark as test signal
        };
        
        parts.forEach(part => {
          const lower = part.toLowerCase();
          if (lower.startsWith("lane:")) testSignal.lane = part.slice(5).toUpperCase();
          else if (lower.startsWith("entity:")) testSignal.entity = part.slice(7);
          else if (lower.startsWith("asset:")) testSignal.asset = part.slice(6);
          else if (lower.startsWith("symbol:")) testSignal.symbol = part.slice(7);
          else if (lower.startsWith("delta:")) {
            const val = parseFloat(part.slice(6));
            if (!isNaN(val)) {
              testSignal.delta = val;
              testSignal.direction = val > 0 ? "up" : val < 0 ? "down" : "→";
            }
          }
          else if (!testSignal.entity) testSignal.entity = part; // default: first arg is entity
        });
        
        // Inject into handleSignal pipeline
        handleSignal(testSignal);
        
        return `🧪 TEST signal injected: ${testSignal.entity || testSignal.asset || "(no entity)"} [${testSignal.lane}]`;
      }
      
      const q = question.toLowerCase().trim();
      
      // Search historical data
      if (q.includes("find") || q.includes("search") || q.includes("show")) {
        const words = q.split(/\s+/);
        const searchTerm = words[words.length - 1].replace(/[.,!?]/g, '');
        const needle = norm(searchTerm);
        const matches = state.feed.filter(s => 
          matchMode(norm(s.entity), needle, "contains") ||
          matchMode(norm(s.asset), needle, "contains") ||
          matchMode(norm(s.symbol), needle, "contains")
        );
        if (matches.length === 0) return `No historical signals for "${searchTerm}". Try: watch ${searchTerm}`;
        const latest = matches[0]; // feed is reverse-chronological now
        return `Found ${matches.length} past signals for "${searchTerm}". Latest: ${formatSignalForChat(latest)}`;
      }
      
      // Data summary
      if (q.includes("how many") || q.includes("count") || q.includes("total")) {
        const watching = watchFilter.kind !== "off" ? `🔴 Watching: ${watchFilter.kind}` : "Not watching";
        return `Received: ${state.receivedCount} | Accepted: ${state.acceptedCount} | Recs: ${state.recs.length}\n${watching} (matched: ${state.watchMatchedCount})`;
      }
      
      // Bridge health snapshot
      if (q.includes("bridge") || q.includes("health") || q.includes("ops")) {
        if (!state.bridgeHealth?.metrics) {
          return "No bridge health data yet.";
        }
        const m = state.bridgeHealth.metrics;
        const status = computeBridgeHealthStatus(m);
        return `Bridge: ${status.toUpperCase()}. Fwd: ${m.forwarded || 0}, Drop: ${m.dropped || 0}, Retry: ${m.retries || 0}, Fail: ${m.failures || 0}.`;
      }
      
      // Latest signal
      if (q.includes("latest") || q.includes("recent") || q.includes("last")) {
        if (state.feed.length === 0) return "No signals yet.";
        const latest = state.feed[0]; // feed is now newest-first
        return `Latest: ${formatSignalForChat(latest)}`;
      }
      
      // Top movers
      if (q.includes("top") || q.includes("biggest") || q.includes("largest")) {
        const sorted = [...state.feed]
          .filter(s => s.delta != null)
          .sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta))
          .slice(0, 3);
        if (sorted.length === 0) return "No delta data available.";
        return `Top movers: ${sorted.map(s => `${s.entity || s.asset || "?"} (${s.delta > 0 ? "+" : ""}${s.delta})`).join(", ")}`;
      }
      
      // Help
      if (q.includes("help") || q.includes("what can") || q === "?") {
        const devHelp = IS_DEV ? " | inject oil (dev)" : "";
        return `Commands: watch oil | watch lane:prices | watch any:btc | unwatch | status | find oil | latest | top movers | count | bridge${devHelp}`;
      }
      
      // Default
      const devCmd = IS_DEV ? " | inject oil" : "";
      return `Try: watch oil | watch lane:prices | unwatch | status | find oil | latest | help${devCmd}`;
    }

    function sendChatMessage() {
      const message = chatInputEl.value.trim();
      if (!message) return;
      
      addChatMessage("user", message);
      chatInputEl.value = "";
      
      // Simulate assistant response
      setTimeout(() => {
        const response = answerQuestion(message);
        addChatMessage("assistant", response);
      }, 300);
    }

    chatboxToggleEl.addEventListener("click", toggleChatbox);
    chatSendEl.addEventListener("click", sendChatMessage);
    chatInputEl.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendChatMessage();
    });

    init();
  </script>
</body>
